# Admin saves are read from Supabase using its public, read-only API.
# The production deployment identity is a GitHub Actions secret, never browser code.
name: Publish site automatically

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *" # best-effort; avoids the busiest minute
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test SEO rendering and publication status
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          node --test scripts/test_seo_publish.cjs
      - name: Build published blog pages
        run: python scripts/build_blog.py
      - name: Sync public prices and rating
        run: |
          node scripts/syncprices.js
          node scripts/syncrating.js
      - name: Bake SEO into the initial HTML in all four languages
        run: python scripts/syncseo.py
      - name: Update public reference files
        run: |
          node scripts/freshness.js
          node scripts/llmsfull.js
          python scripts/gen_sitemap.py
      - name: Validate and package only public files
        run: |
          python scripts/validate.py
          python scripts/package_site.py
      - name: Check whether production needs updating
        id: changes
        run: echo "needed=$(python scripts/deployment_needed.py)" >> "$GITHUB_OUTPUT"
      - name: Require the publishing credential
        if: steps.changes.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Cloudflare publishing credential is missing. Production has not been changed.'
            exit 1
          fi
      - name: Install the pinned Cloudflare CLI
        if: steps.changes.outputs.needed == 'true'
        run: npm ci
      - name: Verify a preview, promote, and verify production (restore on failure)
        if: steps.changes.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a954a79fb6767ac99af33f832a5a107b
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy
      - name: Keep generated public source in sync
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No generated source changes.'
            exit 0
          fi
          git config user.name "agava-publish-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "site: sync published content and SEO"
          git push origin HEAD:main
