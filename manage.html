<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ჯავშნის მართვა — სასტუმრო აგავა</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    [hidden] { display: none !important; }
    body { background: linear-gradient(180deg, #fcf8ee 0%, #f2ead9 100%); min-height: 100vh; }
    .mg-wrap { max-width: 500px; margin: 0 auto; padding: 36px 18px 64px; }
    .mg-brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 22px; }
    .mg-brand img { width: 50px; height: 50px; object-fit: contain; }
    .mg-brand span { font-family: "Cinzel", serif; font-size: 26px; font-weight: 700;
      background: linear-gradient(180deg,#C9A050,#8A6A24); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .mg-card { background: #fff; border: 1px solid #EDE5D4; border-radius: 14px; box-shadow: 0 12px 40px rgba(36,29,20,.1); padding: 24px 22px; }

    /* summary */
    .mg-room { font-size: 21px; font-weight: 700; color: var(--ink); }
    .mg-num { font-size: 13px; color: var(--muted); margin: 2px 0 16px; }
    .mg-dates { font-size: 20px; font-weight: 700; color: var(--ink); text-align: center;
      background: #FAF6EE; border: 1px solid #EFE7D6; border-radius: 10px; padding: 16px; margin-bottom: 10px; }
    .mg-meta { text-align: center; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
    .mg-status-line { text-align: center; margin-bottom: 20px; }
    .mg-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 14px; border-radius: 20px; }
    .mg-badge--pending { background:#FDF3E1; color:#9A6B12; }
    .mg-badge--confirmed { background:#E7F4EA; color:#2C7A43; }
    .mg-badge--cancelled { background:#FBEBE7; color:#B4552D; }
    .mg-badge--completed { background:#EDEAF3; color:#5A4B8A; }

    /* big action buttons */
    .mg-menu { display: grid; gap: 12px; }
    .mg-big { display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 18px 20px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer;
      border: 2px solid transparent; transition: transform .15s, box-shadow .2s, background-color .2s; text-align: left; }
    .mg-big:active { transform: scale(.98); }
    .mg-big__ico { font-size: 24px; line-height: 1; }
    .mg-big--dates { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #fff; }
    .mg-big--dates:hover { box-shadow: 0 8px 24px rgba(176,138,60,.32); }
    .mg-big--cancel { background: #fff; border-color: #E7C4B8; color: #B4552D; }
    .mg-big--cancel:hover { background: #FCF3F0; }

    /* expandable panels */
    .mg-panel { margin-top: 4px; }
    .mg-panel h2 { font-size: 17px; margin-bottom: 4px; color: var(--ink); text-align: center; }
    .mg-panel .mg-hint { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 16px; line-height: 1.5; }
    .mg-panel .field { margin-bottom: 14px; }
    .mg-panel .field label { font-size: 14px; }
    .mg-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn--back { background: #F1EBE0; color: var(--ink-soft); }
    .btn--back:hover { background: #E8E0D0; }
    .mg-confirm-q { text-align: center; font-size: 16px; color: var(--ink); margin: 6px 0 18px; line-height: 1.5; }

    #mgStatus { text-align: center; padding: 50px 0; color: var(--muted); font-size: 15px; }
    .mg-help { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
    .mg-help a { color: #1FA855; font-weight: 700; }
    .mg-back-home { display:block; text-align:center; margin-top: 18px; color: var(--gold); font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="mg-wrap">
    <a class="mg-brand" href="index.html" aria-label="სასტუმრო აგავა">
      <img width="256" height="256" src="assets/logo.webp" alt=""><span>AGAVA</span>
    </a>

    <div id="mgStatus">იტვირთება…</div>

    <div class="mg-card" id="mgCard" hidden>
      <div class="mg-room" id="mgRoom">—</div>
      <div class="mg-num" id="mgNumber"></div>

      <div class="mg-dates" id="mgDates">—</div>
      <div class="mg-meta" id="mgMeta"></div>
      <div class="mg-status-line" id="mgStatusLine"></div>

      <!-- STEP 0: two big buttons -->
      <div class="mg-menu" id="mgMenu">
        <button class="mg-big mg-big--dates" id="mgBtnDates" type="button">
          <span class="mg-big__ico">🗓</span><span>თარიღის შეცვლა</span>
        </button>
        <button class="mg-big mg-big--cancel" id="mgBtnCancel" type="button">
          <span class="mg-big__ico">✕</span><span>ჯავშნის გაუქმება</span>
        </button>
      </div>

      <!-- STEP A: change dates -->
      <div class="mg-panel" id="mgDatesPanel" hidden>
        <h2>ახალი თარიღები</h2>
        <p class="mg-hint">აირჩიეთ ახალი შესვლა და გასვლა, დააჭირეთ „შენახვას".</p>
        <div class="field"><label for="mgIn">შესვლა</label><input type="date" id="mgIn"></div>
        <div class="field"><label for="mgOut">გასვლა</label><input type="date" id="mgOut"></div>
        <div class="mg-row2">
          <button class="btn btn--back" id="mgBackA" type="button">← უკან</button>
          <button class="btn btn--gold" id="mgSaveDates" type="button">შენახვა</button>
        </div>
        <p class="form-status" id="mgResStatus" role="status" aria-live="polite"></p>
      </div>

      <!-- STEP B: cancel confirm -->
      <div class="mg-panel" id="mgCancelPanel" hidden>
        <p class="mg-confirm-q">ნამდვილად გსურთ ჯავშნის გაუქმება?</p>
        <div class="mg-row2">
          <button class="btn btn--back" id="mgBackB" type="button">← არა, დავტოვებ</button>
          <button class="btn btn--gold" id="mgDoCancel" type="button">დიახ, გავაუქმებ</button>
        </div>
        <p class="form-status" id="mgCancelStatus" role="status" aria-live="polite"></p>
      </div>

      <p class="mg-help">დახმარება? <a id="mgWa" href="#" target="_blank" rel="noopener">მოგვწერეთ WhatsApp-ზე</a></p>
    </div>

    <a class="mg-back-home" href="index.html">← მთავარ გვერდზე</a>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
