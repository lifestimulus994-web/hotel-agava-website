<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ჯავშნის მართვა — სასტუმრო აგავა</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: linear-gradient(180deg, #fcf8ee 0%, #f2ead9 100%); min-height: 100vh; }
    .mg-wrap { max-width: 560px; margin: 0 auto; padding: 40px 18px 64px; }
    .mg-brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 26px; }
    .mg-brand img { width: 52px; height: 52px; object-fit: contain; }
    .mg-brand span { font-family: "Cinzel", serif; font-size: 26px; font-weight: 700;
      background: linear-gradient(180deg,#C9A050,#8A6A24); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .mg-card { background: #fff; border: 1px solid #EDE5D4; border-radius: 12px; box-shadow: 0 12px 40px rgba(36,29,20,.1); padding: 26px 24px; }
    .mg-card h1 { font-size: 22px; margin-bottom: 6px; color: var(--ink); }
    .mg-num { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .mg-rows { display: grid; gap: 10px; margin: 16px 0 20px; }
    .mg-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; color: var(--ink-soft); border-bottom: 1px dashed #EFE7D6; padding-bottom: 9px; }
    .mg-row b { color: var(--ink); font-weight: 700; }
    .mg-total b { color: var(--gold); font-size: 17px; }
    .mg-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .mg-badge--pending { background:#FDF3E1; color:#9A6B12; }
    .mg-badge--confirmed { background:#E7F4EA; color:#2C7A43; }
    .mg-badge--cancelled { background:#FBEBE7; color:#B4552D; }
    .mg-badge--completed { background:#EDEAF3; color:#5A4B8A; }
    .mg-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid #F0E8D8; }
    .mg-section h2 { font-size: 15px; margin-bottom: 12px; color: var(--ink); }
    .mg-actions { display: grid; gap: 10px; }
    .mg-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; line-height: 1.55; }
    #mgStatus { text-align: center; padding: 40px 0; color: var(--muted); }
    .mg-back { display:inline-block; margin-top: 22px; color: var(--gold); font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="mg-wrap">
    <a class="mg-brand" href="index.html" aria-label="სასტუმრო აგავა">
      <img src="assets/logo.png" alt=""><span>AGAVA</span>
    </a>

    <div id="mgStatus">იტვირთება…</div>

    <div class="mg-card" id="mgCard" hidden>
      <h1 id="mgRoom">—</h1>
      <div class="mg-num" id="mgNumber"></div>
      <div class="mg-rows" id="mgRows"></div>

      <div class="mg-section" id="mgReschedule">
        <h2>თარიღების შეცვლა</h2>
        <div class="mg-actions">
          <div class="field"><label for="mgIn">ახალი შესვლა</label><input type="date" id="mgIn"></div>
          <div class="field"><label for="mgOut">ახალი გასვლა</label><input type="date" id="mgOut"></div>
          <button class="btn btn--gold" id="mgSaveDates" type="button">თარიღების განახლება</button>
        </div>
        <p class="mg-note">თარიღების შეცვლის შემდეგ ჯავშანი დაბრუნდება „მოლოდინში“ და სასტუმრო ხელახლა დაგიდასტურებთ.</p>
        <p class="form-status" id="mgResStatus" role="status" aria-live="polite"></p>
      </div>

      <div class="mg-section" id="mgCancelSec">
        <h2>ჯავშნის გაუქმება</h2>
        <button class="btn btn--ghost-dark" id="mgCancel" type="button">ჯავშნის გაუქმება</button>
        <p class="mg-note">გაუქმება უფასოა ჩამოსვლამდე 24 საათით ადრე.</p>
        <p class="form-status" id="mgCancelStatus" role="status" aria-live="polite"></p>
      </div>

      <a class="mg-back" href="index.html">← მთავარ გვერდზე</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
